<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>记账</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="topbar-main">
      <h1 id="pageTitle">记账</h1>
      <span id="pageSub" class="topbar-sub"></span>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button type="button" data-page="home" class="is-on">记账</button>
    <button type="button" data-page="ledger">流水</button>
    <button type="button" data-page="stats">统计</button>
    <button type="button" data-page="debt">借贷</button>
    <button type="button" data-page="settings">设置</button>
  </nav>
</div>

<div class="sheet-backdrop" id="sheetBackdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden>
  <span id="toastText"></span>
  <button type="button" id="toastUndo">撤销</button>
</div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/stats.js"></script>
<script src="js/io.js"></script>
<script src="js/app.js"></script>
</body>
</html>
